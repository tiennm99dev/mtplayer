[package]
name = "mtp-sdk"
description = "Provisions Google's emulator and system image, and Magisk's binary, after the user accepts each license."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "mtp_sdk"

[features]
# Lets tests point the client at a loopback fixture server. Binaries never enable it.
test-support = []

[dependencies]
crc32fast.workspace = true
hex.workspace = true
jiff.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true
walkdir.workspace = true
windows-sys.workspace = true
zip.workspace = true

[dev-dependencies]
mtp-sdk = { path = ".", features = ["test-support"] }
tempfile.workspace = true
